<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voter Protection Portal | HCDP War Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/state_party_clone.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: white;} /* Dark mode War Room feel */
    .container { max-width: 800px; margin: 3rem auto; padding: 2rem; background: #1e293b; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { font-family: 'Montserrat', sans-serif; color: #f8fafc; }
    
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1; }
    select, input, textarea { width: 100%; padding: 0.75rem; border: 1px solid #475569; border-radius: 6px; font-family: 'Inter', sans-serif; background: #0f172a; color: white;}
    
    button { background: #ef4444; color: white; padding: 1rem 1.5rem; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; width: 100%; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em;}
    button:hover { background: #dc2626; }
    
    .status-panel { display: none; margin-top: 2rem; padding: 1.5rem; background: #052e16; border-left: 4px solid #22c55e; border-radius: 6px; }
    .status-panel h4 { margin: 0 0 0.5rem 0; color: #4ade80; font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body>

  <nav class="tx-clone-nav" style="background: #000;">
    <div class="tx-clone-nav-center">
      <span class="nav-item" style="color: #ef4444; font-weight: 800;">HCDP SECURE PORTAL</span>
    </div>
  </nav>

  <div class="container">
    <h2>🛡️ Real-Time Incident Reporter</h2>
    <p style="color: #94a3b8; margin-bottom: 2rem;">Authorized Poll Watchers only. Log issues below to instantly ping Chief Legal Counsel and update the War Room dashboard.</p>
    
    <div class="form-group">
      <label>Polling Location</label>
      <input type="text" id="pollLoc" placeholder="e.g. McAllen Fireman's Park" />
    </div>

    <div class="form-group">
      <label>Incident Type</label>
      <select id="incidentType">
        <option value="machine">Voting Machine Breakdown / Glitch</option>
        <option value="suppression">Voter Intimidation / Suppression</option>
        <option value="electioneering">Illegal Electioneering (Within 100ft)</option>
        <option value="supply">Running out of Ballots / Supplies</option>
      </select>
    </div>

    <div class="form-group">
      <label>Incident Description</label>
      <textarea id="desc" rows="4" placeholder="Provide details..."></textarea>
    </div>

    <div class="form-group" style="display: flex; align-items: center; margin-bottom: 2rem;">
      <input type="checkbox" id="urgent" style="width: auto; margin-right: 0.5rem;" />
      <label for="urgent" style="margin: 0; color: #f87171;">Flag as URGENT (Triggers SMS to Legal Team)</label>
    </div>
    
    <button onclick="submitIncident()">Log Incident</button>

    <div class="status-panel" id="statusPanel">
      <h4>✔️ INCIDENT LOGGED</h4>
      <p style="margin:0; color: #a7f3d0; font-size: 0.9rem;">Payload routed securely to War Room. Legal team has been notified.</p>
    </div>
  </div>

  <script>
    function submitIncident() {
      // Mock submitting webhook
      const btn = document.querySelector('button');
      btn.innerText = "ROUTING...";
      btn.style.background = "#64748b";
      
      setTimeout(() => {
        btn.innerText = "LOG ANOTHER INCIDENT";
        btn.style.background = "#0a3161";
        document.getElementById('statusPanel').style.display = 'block';
        
        // Reset form
        document.getElementById('pollLoc').value = '';
        document.getElementById('desc').value = '';
        document.getElementById('urgent').checked = false;
      }, 1500);
    }
  </script>
</body>
</html>
