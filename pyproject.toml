[project]
name = "hidalgo-county-dem-party-core"
version = "0.1.0"
description = "Core application scripts and architecture for HCDP"
authors = [
    {name = "Antigravity", email = "info@antigravity.ai"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "pydantic-settings",
    "beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 88
