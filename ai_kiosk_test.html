<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voter Kiosk | Hidalgo County Democrats</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/state_party_clone.css">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .kiosk-header {
      text-align: center;
      padding: 2rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .kiosk-header h1 {
      font-family: 'Alfa Slab One', serif;
      color: #38bdf8;
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .message {
      max-width: 80%;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      line-height: 1.6;
      font-size: 1.1rem;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
      background: #3b82f6;
      color: white;
      border-bottom-right-radius: 0.25rem;
    }
    .message.ai {
      align-self: flex-start;
      background: rgba(255,255,255,0.1);
      border-bottom-left-radius: 0.25rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .input-area {
      padding: 2rem;
      background: #1e293b;
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    .input-container {
      max-width: 800px;
      width: 100%;
      display: flex;
      gap: 1rem;
    }
    #questionInput {
      flex: 1;
      padding: 1.2rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: white;
      font-size: 1.1rem;
      font-family: 'Inter', sans-serif;
    }
    #questionInput:focus {
      outline: none;
      border-color: #38bdf8;
    }
    #askButton {
      padding: 0 2rem;
      border-radius: 0.75rem;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #askButton:hover {
      background: #7dd3fc;
    }
    #askButton:disabled {
      background: #64748b;
      cursor: not-allowed;
    }
    .loading-dots {
      display: flex;
      gap: 0.3rem;
      padding: 1.5rem;
    }
    .loading-dots div {
      width: 8px;
      height: 8px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dots div:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots div:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    
    /* Markdown styling inside AI messages */
    .message.ai h1, .message.ai h2, .message.ai h3 { margin-top: 0; color: #38bdf8; }
    .message.ai p:last-child { margin-bottom: 0; }
    .message.ai ul { padding-left: 1.5rem; }
  </style>
</head>
<body>
  
  <div class="kiosk-header">
    <h1>Digital Campaign Manager</h1>
    <p style="color: #94a3b8; font-size: 1.1rem; margin: 0;">Ask me anything about voting, our platform, or how to get involved.</p>
  </div>

  <div class="chat-container" id="chatBox">
    <div class="message ai">
      Hi! I'm the AI assistant for the Hidalgo County Democratic Party. What can I help you with today?
    </div>
  </div>

  <div class="input-area">
    <form class="input-container" id="kioskForm">
      <input type="text" id="questionInput" placeholder="Type your question here... (e.g. Where do I vote?)" autocomplete="off" required>
      <button type="submit" id="askButton">Ask</button>
    </form>
  </div>

  <!-- Note: We are using the bundled app.js to initialize Firebase -->
  <script src="js/app.js"></script>
  <!-- Load marked.js to render markdown from the AI safely -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="js/ai_kiosk.js"></script>
</body>
</html>
