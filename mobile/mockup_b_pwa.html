<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mockup B Pwa - HCDP Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="mobile-header">
        <div class="logo-area">
            <span class="hcdp-title" style="font-weight: 800;">HIDALGO TOGETHER.</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="auth-container"></div>
            <a href="https://secure.actblue.com/donate/hidalgocountydems" class="btn-donate-sm" target="_blank">DONATE</a>
        </div>
    </header>

    <main class="mobile-container pb-tabbar">
        <div class="glass" style="padding: 1.5rem; border-top: 4px solid var(--hcdp-blue);">
            <!-- DYNAMIC INJECTED CONTENT START -->
            
  <div class="app-header">
    <div class="header-top">
      <h1>Contacts CRM</h1>
      <div class="status-indicator">
        <div class="status-dot"></div>
        Synced
      </div>
    </div>
    <input type="text" class="search" placeholder="🔍 Find someone...">
  </div>
  
  <div class="list">
    <div class="section-title">Precinct Chairs</div>
    <div class="list-item">
      <div class="avatar">101</div>
      <div class="info">
        <h3>Jane Doe</h3>
        <p>Pharr • 555-123-4567</p>
      </div>
      <button class="update-btn" onclick="document.getElementById('updateModal').style.display='flex'">Edit Info</button>
    </div>
    <div class="list-item">
      <div class="avatar" style="background:#fef08a; color:#a16207;">102</div>
      <div class="info">
        <h3>John Smith</h3>
        <p>McAllen • 555-987-6543</p>
      </div>
      <button class="update-btn" onclick="document.getElementById('updateModal').style.display='flex'">Edit Info</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="#" class="nav-item active"><span class="nav-icon">👥</span>Directory</a>
    <a href="#" class="nav-item"><span class="nav-icon">📊</span>Metrics</a>
    <a href="#" class="nav-item"><span class="nav-icon">⚙️</span>Settings</a>
  </div>

  <div class="modal" id="updateModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
        <h2 style="margin:0;">Update Record</h2>
        <span style="font-size:2rem; color:#94a3b8; cursor:pointer;" onclick="document.getElementById('updateModal').style.display='none'">&times;</span>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" value="555-123-4567">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" value="jane@example.com">
      </div>
      <button class="btn-primary" onclick="alert('Sent to Google Sheets API! (Mock)'); document.getElementById('updateModal').style.display='none'">Save to Database</button>
    </div>
  </div>
  <script src="js/a11y.js"></script>

            <!-- DYNAMIC INJECTED CONTENT END -->
        </div>
    </main>

    <nav class="bottom-tab-bar glass-tab">
        <a href="index.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="volunteer.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Action</span>
        </a>
        <a href="events.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>Events</span>
        </a>
    </nav>
    <script type="module" src="app.js"></script>
</body>
</html>
