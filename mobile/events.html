<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hidalgo Democrats - Events</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<body>
    <header class="mobile-header">
        <div class="logo-area">
            <span class="hcdp-title" style="font-weight: 800;">EVENTS.</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="auth-container"></div>
        </div>
    </header>

    <main class="mobile-container pb-tabbar">
        <section class="hero-card glass">
            <h1>Upcoming Events</h1>
            <p>RSVP to local party meetings and training sessions.</p>
        </section>

        <section class="quick-links">
            <div class="grid-actions" style="grid-template-columns: 1fr;">
                <a href="#" class="action-card glass-blue">
                    <span class="icon">💻</span>
                    <h3>Zoom Phonebank Training</h3>
                    <p>Friday at 6:00 PM</p>
                </a>
                <a href="#" class="action-card glass-red">
                    <span class="icon">🏛️</span>
                    <h3>Precinct Chair Meeting</h3>
                    <p>Saturday at 10:00 AM</p>
                </a>
                <a href="#" class="action-card glass-purple">
                    <span class="icon">📋</span>
                    <h3>Block Walking Canvass</h3>
                    <p>Sunday at 9:00 AM</p>
                </a>
            </div>
        </section>
    </main>

    <nav class="bottom-tab-bar glass-tab">
        <a href="index.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>

        <a href="volunteer.html" class="tab-item">

            <span>Action</span>
        </a>
        <a href="events.html" class="tab-item active">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>Events</span>
        </a>
        <a href="menu.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
