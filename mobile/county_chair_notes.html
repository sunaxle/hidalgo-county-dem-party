<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/webp" href="../images/facebook_1656248751972_6946810765393131439.webp">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>County Chair Notes - HCDP Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="mobile-header">
        <div class="logo-area">
            <span class="hcdp-title" style="font-weight: 800;">HIDALGO TOGETHER.</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="auth-container"></div>
            <a href="https://secure.actblue.com/donate/hidalgocountydems" class="btn-donate-sm" target="_blank" rel="noopener noreferrer">DONATE</a>
        </div>
    </header>

    <main class="mobile-container pb-tabbar">
        <div class="glass" style="padding: 1.5rem; border-top: 4px solid var(--hcdp-blue);">
            <!-- DYNAMIC INJECTED CONTENT START -->
            

  <!-- Notes Grid Section -->
  <section class="container">
    
    <!-- Category Filters -->
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem;">
      <button onclick="filterNotes('All')" class="btn btn-primary" style="padding: 0.5rem 1.25rem;">Show All</button>
      <button onclick="filterNotes('Tools & Tech')" style="background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; color: #3b82f6; padding: 0.5rem 1.25rem; border-radius: 8px; cursor: pointer;">Tools & Tech</button>
      <button onclick="filterNotes('Communication')" style="background: rgba(250, 204, 21, 0.2); border: 1px solid #facc15; color: #facc15; padding: 0.5rem 1.25rem; border-radius: 8px; cursor: pointer;">Communication</button>
      <button onclick="filterNotes('Operational')" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; padding: 0.5rem 1.25rem; border-radius: 8px; cursor: pointer;">Operational</button>
      <button onclick="filterNotes('Pain Point')" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; padding: 0.5rem 1.25rem; border-radius: 8px; cursor: pointer;">Pain Points</button>
    </div>

    <!-- Chronological Sorting & Timeline Filters -->
    <div style="display: flex; gap: 1rem; justify-content: center; align-items: center; margin-bottom: 3rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <label style="color: #94a3b8; font-size: 0.85rem;">Date Range:</label>
        <select id="dateFilter" onchange="renderNotes()" style="background: #1e293b; color: white; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; outline: none;">
          <option value="all">All Time</option>
          <option value="7">Last 7 Days</option>
          <option value="14">Last 14 Days</option>
          <option value="30">Last 30 Days</option>
        </select>
      </div>
      
      <div style="display: flex; align-items: center; gap: 0.5rem; margin-left: 1rem;">
        <label style="color: #94a3b8; font-size: 0.85rem;">Sort By:</label>
        <select id="sortFilter" onchange="renderNotes()" style="background: #1e293b; color: white; border: 1px solid #334155; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; outline: none;">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="urgent">Urgent Items First</option>
        </select>
      </div>
    </div>

    <div id="notes-container" class="notes-grid">

      <!-- Notes are rendered via JavaScript -->
    </div>
    
    <div class="add-note-container">
      <button class="add-note-btn" onclick="openAddModal()">
        <span style="font-size: 1.5rem;">+</span> Add a Note to the Board
      </button>
    </div>
  </section>

  <!-- Add Note Modal UI -->
  <div id="addNoteModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(10px);">
    <div style="background: #1e293b; padding: 2.5rem; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid rgba(255,255,255,0.1); position: relative;">
      <h2 style="color: white; margin-bottom: 1.5rem;">Submit a Board Note</h2>
      <input type="text" id="newNoteAuthor" placeholder="Your Name or Precinct (e.g., Alvera)" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 1rem;">
      <select id="newNoteCategory" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 1rem;">
        <option value="Tools & Tech">Tools & Tech (Blue)</option>
        <option value="Communication">Communication (Yellow)</option>
        <option value="Operational">Operational (Red)</option>
        <option value="Pain Point">Pain Point (Red)</option>
        <option value="General">General Suggestion (Yellow)</option>
      </select>
      <textarea id="newNoteText" placeholder="What do you want to request or accomplish?" rows="4" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 1.5rem;"></textarea>
      
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button onclick="closeAddModal()" style="padding: 0.5rem 1rem; background: transparent; color: #94a3b8; border: none; cursor: pointer;">Cancel</button>
        <button onclick="submitNewNote()" class="btn btn-primary" style="padding: 0.5rem 1.5rem;">Post Note</button>
      </div>
    </div>
  </div>

  <!-- Chairman Response Modal UI -->
  <div id="responseModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(10px);">
    <div style="background: #1e293b; padding: 2.5rem; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid #3b82f6; position: relative;">
      <h2 style="color: white; margin-bottom: 0.5rem;">Executive Reply</h2>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem;">Logged as: Chairman Gonzales</p>
      
      <select id="newResponseStatus" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 1rem;">
        <option value="In Progress">Status: In Progress</option>
        <option value="Resolved">Status: Resolved</option>
        <option value="Declined">Status: Declined</option>
      </select>

      <textarea id="newResponseText" placeholder="Enter official executive reply..." rows="4" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 1.5rem;"></textarea>
      
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button onclick="closeResponseModal()" style="padding: 0.5rem 1rem; background: transparent; color: #94a3b8; border: none; cursor: pointer;">Cancel</button>
        <button onclick="submitResponse()" class="btn btn-primary" style="padding: 0.5rem 1.5rem;">Attach Reply</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  
            <!-- DYNAMIC INJECTED CONTENT END -->
        </div>
    </main>

    <nav class="bottom-tab-bar glass-tab">

            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>

            <span>Action</span>

        <a href="events.html" class="tab-item">

            <span>Events</span>
        </a>
        <a href="menu.html" class="tab-item">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span>Menu</span>
        </a>
    </nav>
    <script type="module" src="app.js"></script>
</body>
</html>
