<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - HCDP Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="mobile-header">
        <div class="logo-area">
            <span class="hcdp-title" style="font-weight: 800;">HIDALGO TOGETHER.</span>
        </div>
        <a href="https://secure.actblue.com/donate/hidalgocountydems" class="btn-donate-sm" target="_blank">DONATE</a>
    </header>

    <main class="mobile-container pb-tabbar">
        <div class="glass" style="padding: 1.5rem; border-top: 4px solid var(--hcdp-blue);">
            <!-- DYNAMIC INJECTED CONTENT START -->
            
<!-- Optional particle background for a high-tech feel -->
  <div id="particles-js"></div>

  <div class="login-container">
    <!-- Icon or Logo placeholder -->
    <div style="width: 50px; height: 50px; background: rgba(59, 130, 246, 0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; border: 1px solid rgba(59, 130, 246, 0.4); font-size: 24px;">
      🌻
    </div>

    <h1>Flower Login</h1>
    <p>Authorized personnel only. Please sign in.</p>

    <div class="input-group">
      <label for="passcode">Authentication Key</label>
      <input type="password" id="passcode" placeholder="••••••••" autocomplete="off" autofocus>
    </div>

    <button id="loginBtn" class="login-btn">Secure Login</button>
    <div id="errorMsg" class="error-msg">❌ Access Denied: Invalid configuration key.</div>

    <a href="home.html" class="back-link">← Return to Public Site</a>
  </div>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    // Particle JS Background Initialization
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.1, "random": false },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.1, "width": 1 },
        "move": { "enable": true, "speed": 1, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
      },
      "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": false }, "onclick": { "enable": false }, "resize": true } },
      "retina_detect": true
    });

    // Minimal Security Javascript String Check
    document.getElementById('loginBtn').addEventListener('click', attemptLogin);
    document.getElementById('passcode').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') attemptLogin();
    });

    function attemptLogin() {
      const code = document.getElementById('passcode').value;
      const errorDiv = document.getElementById('errorMsg');
      
      // The simulated password gateway string
      if (code === 'PC26') {
        errorDiv.style.display = 'none';
        
        // Show loading state
        const btn = document.getElementById('loginBtn');
        btn.innerHTML = `
          <svg style="animation: spin 1s linear infinite; height: 1.25rem; width: 1.25rem; color: white; display: inline-block; vertical-align: middle;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle style="opacity: 0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path style="opacity: 0.75;" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span style="vertical-align: middle; margin-left: 0.5rem;">Decrypting...</span>
        `;
        
        // Simulate network delay then route to dashboard
        setTimeout(() => {
          window.location.href = 'admin_dashboard.html';
        }, 800);
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('passcode').value = '';
        document.getElementById('passcode').focus();
      }
    }
  </script>

  <script src="js/a11y.js"></script>

            <!-- DYNAMIC INJECTED CONTENT END -->
        </div>
    </main>

    <nav class="bottom-tab-bar glass-tab">
        <a href="index.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="volunteer.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Action</span>
        </a>
        <a href="events.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>Events</span>
        </a>
    </nav>
</body>
</html>
