<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Precinct - HCDP Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="mobile-header">
        <div class="logo-area">
            <span class="hcdp-title" style="font-weight: 800;">HIDALGO TOGETHER.</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="auth-container"></div>
            <a href="https://secure.actblue.com/donate/hidalgocountydems" class="btn-donate-sm" target="_blank">DONATE</a>
        </div>
    </header>

    <main class="mobile-container pb-tabbar">
        <div class="glass" style="padding: 1.5rem; border-top: 4px solid var(--hcdp-blue);">
            <!-- DYNAMIC INJECTED CONTENT START -->
            
    
    <section class="p-main-section">
      <div class="p-profile">
        <img id="p-photo" src="" alt="Precinct Chair Photo" />
        <h2 id="p-name">Chair Name</h2>
        <div id="p-social-links" class="p-social-links"></div>
      </div>
      
      <div class="p-info">
        <h3>About the Chair</h3>
        <p id="p-bio">Bio text here...</p>
        
        <div class="p-boxes">
          <div class="p-box">
            <h4>Latest Announcement</h4>
            <p id="p-announcement"></p>
          </div>
          <div class="p-box">
            <h4>Next Meeting</h4>
            <p><strong>Time:</strong> <span id="p-meeting-time"></span></p>
            <p><strong>Location:</strong> <span id="p-meeting-location"></span></p>
          </div>
          <div class="p-box">
            <h4>Contact</h4>
            <p><strong>Email:</strong> <a id="p-email" href="#"></a></p>
            <p><strong>Phone:</strong> <span id="p-phone"></span></p>
          </div>
          <!-- Social Share Module -->
          <div class="p-box" style="grid-column: 1/-1; display:flex; gap: 1rem; align-items:center; justify-content:center; background: rgba(56, 189, 248, 0.05); border: 1px dashed rgba(56, 189, 248, 0.3); margin-top: 1rem;">
            <span style="color: #64748b; font-weight: 600; font-size: 0.95rem; margin-right: 1rem;">Share This Profile:</span>
            <button id="btn-copy-link" style="padding: 0.75rem 1.5rem; border-radius: 8px; border: 2px solid var(--primary); background: transparent; color: var(--primary); font-weight: 700; cursor: pointer; transition: all 0.2s; font-size:0.95rem;">🔗 Copy Link</button>
            <button id="btn-share-fb" style="padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #1877F2; color: #fff; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size:0.95rem;">
              <svg style="width:16px; height:16px; vertical-align:middle; margin-right:6px; fill:currentColor;" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg> 
              Tweet
            </button>
            <button id="btn-share-actual-fb" style="padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #1877F2; color: #fff; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size:0.95rem;">
               Facebook
            </button>
          </div>
          
          <!-- Admin Update Module -->
          <div style="grid-column: 1/-1; text-align: center; margin-top: 1rem;">
             <a href="https://docs.google.com/forms/d/e/1FAIpQLSen2v3G97MNdDWQTfurqQZFc7EYt9nABA2HnYZg_MSWmQLIIQ/viewform?usp=sf_link" id="admin-update-link" target="_blank" style="color: #64748b; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#facc15'" onmouseout="this.style.color='#64748b'">
               Chair Admin: Update This Profile 🔒
             </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  
            <!-- DYNAMIC INJECTED CONTENT END -->
        </div>
    </main>

    <nav class="bottom-tab-bar glass-tab">
        <a href="index.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="volunteer.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Action</span>
        </a>
        <a href="events.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>Events</span>
        </a>
        <a href="menu.html" class="tab-item">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            <span>Menu</span>
        </a>
    </nav>
    <script type="module" src="app.js"></script>
</body>
</html>
