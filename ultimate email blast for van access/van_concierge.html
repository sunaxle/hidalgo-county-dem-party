<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAN Concierge | Hidalgo County Democrats</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --primary: #3b82f6;
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      padding: 2rem;
    }
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .option-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .option-card {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .option-card:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
    }
    .option-card input[type="radio"] {
      margin-top: 5px;
      transform: scale(1.3);
    }
    .option-details h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
    }
    .option-details p {
      margin: 0;
      font-size: 0.9rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: white;
      text-align: center;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 2rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="glass-card">
      <h1>VAN Concierge Service</h1>
      <p>Don't have time to learn new software? No problem. We will pull the data you need and email it to you directly as a clean, printable PDF walk list.</p>
      
      <form action="#" method="POST" id="conciergeForm">
        <div class="option-group">
          
          <label class="option-card">
            <input type="radio" name="list_type" value="super_democrats" required>
            <div class="option-details">
              <h3>🏆 My Super Democrats</h3>
              <p>The most reliable Democratic voters in your precinct. Perfect for ensuring high turnout.</p>
            </div>
          </label>

          <label class="option-card">
            <input type="radio" name="list_type" value="newly_registered">
            <div class="option-details">
              <h3>🌱 Newly Registered Voters</h3>
              <p>Voters who recently registered in your area and need a welcoming knock on their door.</p>
            </div>
          </label>

          <label class="option-card">
            <input type="radio" name="list_type" value="vbm_seniors">
            <div class="option-details">
              <h3>✉️ Seniors Needing VBM Help</h3>
              <p>Voters over 65 who reliably vote but haven't requested their Vote-By-Mail application yet.</p>
            </div>
          </label>

        </div>

        <button type="submit" class="btn">Send Me My List</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('conciergeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const selected = document.querySelector('input[name="list_type"]:checked').value;
      alert("Success! The Field Director has been notified and will email you the " + selected + " list within 24 hours.");
      // Here you would hook into your existing Google Apps Script or Firebase function
    });
  </script>

</body>
</html>
