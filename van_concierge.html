    :root {
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --primary: #3b82f6;
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      padding: 2rem;
    }
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .option-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .option-card {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .option-card:hover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.1);
    }
    .option-card input[type="radio"] {
      margin-top: 5px;
      transform: scale(1.3);
    }
    .option-details h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
    }
    .option-details p {
      margin: 0;
      font-size: 0.9rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: white;
      text-align: center;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 2rem;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      color: white;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;

    .form-control:focus {

      border-color: var(--primary);

  <script>
    // REPLACE THIS URL with your deployed Google Apps Script Web App URL
    const WEB_APP_URL = "YOUR_WEB_APP_URL_HERE";

    document.getElementById('conciergeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.querySelector('button[type="submit"]');
      btn.innerText = "Sending...";
      btn.disabled = true;

      const formData = new FormData(this);
      const data = new URLSearchParams(formData);

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: data
      })
      .then(response => response.text())
      .then(result => {
        document.querySelector('.glass-card').innerHTML = "<h1>✅ Success!</h1><p>The Field Director has received your request and will email you the list within 24 hours.</p>";
      })
      .catch(error => {
        alert("There was an error sending your request. Please try again or email us directly.");
        btn.innerText = "Send Me My List";
        btn.disabled = false;
      });
    });
  </script>
