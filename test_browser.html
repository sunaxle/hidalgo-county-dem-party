<!DOCTYPE html>
<html>
<body>
<script>
window.onerror = function(msg, url, lineNo, columnNo, error) {
  fetch('http://localhost:8002/log', {
    method: 'POST',
    body: JSON.stringify({msg, url, lineNo, columnNo, error: error ? error.stack : ''})
  });
};
window.addEventListener('unhandledrejection', function(event) {
  fetch('http://localhost:8002/log', {
    method: 'POST',
    body: JSON.stringify({msg: 'Promise rejection: ' + event.reason})
  });
});
</script>
<iframe src="precinct_chairs.html" style="width:100%;height:800px;"></iframe>
</body>
</html>
