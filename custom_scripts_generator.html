<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Scripts Generator | HCDP Internal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/state_party_clone.css" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    .container { max-width: 900px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { font-family: 'Montserrat', sans-serif; color: #0a3161; }
    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #334155; }
    select, input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; }
    button { background: #0a3161; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 1rem;}
    button:hover { background: #001a40; }
    
    .output-card { background: #f1f5f9; padding: 1.5rem; border-radius: 6px; border-left: 4px solid #3b82f6; position: relative; margin-bottom: 1.5rem;}
    .output-card h4 { margin-top: 0; color: #0f172a; font-family: 'Montserrat', sans-serif; }
    .copy-btn { position: absolute; top: 1rem; right: 1rem; background: white; color: #3b82f6; border: 1px solid #3b82f6; padding: 0.25rem 0.5rem; font-size: 0.8rem; border-radius: 4px; cursor: pointer;}
    .copy-btn:hover { background: #eff6ff; }
  </style>
</head>
<body>

  <nav class="tx-clone-nav">
    <div class="tx-clone-nav-center">
      <a href="precinct_toolkit.html" class="nav-item" style="color: white; font-weight: 800; text-decoration: none;">← BACK TO TOOLKIT</a>
    </div>
  </nav>

  <div class="container">
    <h2>📞 Custom Call & Text Scripts</h2>
    <p style="color: #64748b; margin-bottom: 2rem;">Generate dynamic organizing scripts tailored to your specific precinct.</p>
    
    <div class="grid">
      <div class="controls">
        <div class="form-group">
          <label>Precinct Number</label>
          <input type="number" id="precinctNum" placeholder="e.g. 107" value="107" />
        </div>
        <div class="form-group">
          <label>Language Focus</label>
          <select id="language">
            <option value="en">English (Primary)</option>
            <option value="es">Spanish (Bilingual)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Your Name (Volunteer)</label>
          <input type="text" id="volName" placeholder="e.g. Maria" value="Maria" />
        </div>
        <button onclick="generateScripts()">Generate Scripts</button>
      </div>

      <div class="results" id="results" style="display: none;">
        
        <div class="output-card">
          <h4>📱 Peer-to-Peer Text (Initial Outreach)</h4>
          <button class="copy-btn" onclick="copyText('txt1')">Copy</button>
          <p id="txt1"></p>
        </div>

        <div class="output-card">
          <h4>📱 Peer-to-Peer Text (Event Invite)</h4>
          <button class="copy-btn" onclick="copyText('txt2')">Copy</button>
          <p id="txt2"></p>
        </div>

        <div class="output-card">
          <h4>📞 Phone Bank Script (Voicemail)</h4>
          <button class="copy-btn" onclick="copyText('txt3')">Copy</button>
          <p id="txt3"></p>
        </div>

      </div>
    </div>
  </div>

  <script>
    function generateScripts() {
      const pct = document.getElementById('precinctNum').value;
      const lang = document.getElementById('language').value;
      const name = document.getElementById('volName').value;

      let t1, t2, t3;

      if(lang === 'en') {
        t1 = `Hi! This is ${name}, a volunteer with the Hidalgo County Democratic Party in Precinct ${pct}. We're working hard to hit our 20,000 voter goal this year! Can we count on your support for our local candidates this November?`;
        t2 = `Hey neighbor! ${name} here from the Precinct ${pct} Dems. We are having a neighborhood block walk this Saturday to talk about the upcoming election. Want to join us and make a difference? RSVP here: [LINK]`;
        t3 = `Hi, this is ${name} calling with the Hidalgo County Democrats. I'm your neighbor right here in Precinct ${pct}. I'm sorry I missed you, I was just calling to remind you about the upcoming early voting period and see what local issues matter most to you. Give us a call back, or visit hidalgocountydems.org. Thanks!`;
      } else {
        t1 = `¡Hola! Soy ${name}, un voluntario con el Partido Demócrata del Condado de Hidalgo en el Precinto ${pct}. ¡Estamos trabajando duro para alcanzar nuestra meta de 20,000 votantes! ¿Podemos contar con su apoyo para nuestros candidatos locales en noviembre?`;
        t2 = `¡Hola vecino! Habla ${name} de los Demócratas del Precinto ${pct}. Vamos a tener una caminata en el vecindario este sábado para hablar sobre la elección. ¿Te gustaría unirte? Confirma tu asistencia aquí: [LINK]`;
        t3 = `Hola, habla ${name} con los Demócratas del Condado de Hidalgo. Soy su vecino en el Precinto ${pct}. Siento no haberlo encontrado, solo llamaba para recordarle sobre el período de votación anticipada y ver qué temas le importan más. Llámenos, o visite hidalgocountydems.org. ¡Gracias!`;
      }

      document.getElementById('txt1').innerText = t1;
      document.getElementById('txt2').innerText = t2;
      document.getElementById('txt3').innerText = t3;
      
      document.getElementById('results').style.display = 'block';
    }

    function copyText(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text);
      alert('Copied to clipboard!');
    }
  </script>
</body>
</html>
