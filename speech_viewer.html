const mainSpeech = `
# Precinct Chair Mini-Meeting: Leading Our Neighborhoods to Victory in November

As the grassroots leaders of the Hidalgo County Democratic Party, Precinct Chairs are the tip of the spear. Elections in the Rio Grande Valley aren't won by national TV ads—they are won block by block, neighbor to neighbor.

**Our Focus is on the Ground:** We are the party's frontline. With November approaching fast, we cannot afford to wait for marching orders to start doing our jobs. The voters in your precincts are looking to us to protect their public schools, their jobs, and their rights. The true power of the Democratic Party doesn’t live in an office; it lives in this room. You don't need anyone's permission to organize your neighborhood.

**We currently have historic numbers of Precinct Chairs.** Because of our aggressive recruitment, we now have enough active chairs to cover roughly **80% of the voting population** in Hidalgo County. That means our reach is unprecedented, and if every one of us engages our specific neighborhoods, our collective impact will be unstoppable. 

Here are the key talking points to guide our strategy and actions leading up to November.

## 1. Embrace the Precinct Chair "Lifestyle"
* **It's Not Bureaucracy, It's Community:** If you look at the Texas Election Code, being a Precinct Chair sounds like a dry chore. But in reality, it is a highly social, rewarding, and fun lifestyle. Building a base starts with breaking the ice.
* **Have Confidence in Our Message:** Never be afraid to proudly share our Democratic values. We stand for fully funded public schools, good-paying jobs, and accessible healthcare. That message *resonates* deeply with the people in the Valley. Have the confidence to spread it unapologetically, knowing you are fighting for exactly what our community wants and needs.
* **You Are the Local Expert:** Nobody knows your neighborhood better than you do. You know if your area responds better to a weekend pachanga, a traditional block walk, or a neighborhood WhatsApp group. Trust your instincts on how to best engage your specific streets—there is no one-size-fits-all approach.
* **The "Burgers in the Park" Lesson:** Look at Pct 107. They didn’t build their base with just cold calls. They hosted a "Free Burgers at the Park" community mixer. It is about drinking coffee with volunteers, throwing block parties, and getting to know the families on your street.
* **Be the Ultimate Political Connector:** You are the gateway. You bring the mayor, the candidates, and the resources directly to your neighbors’ doorsteps (maybe over a slice of pizza). You give them a voice.

## 2. Master the Basics & Build Regional Coalitions
* **Know your turf & hit the doors:** Block walking and phone banking remain the undisputed most effective ways to increase turnout. Commit to a realistic goal. 
* **No Chair is an Island:** Truly effective organizing doesn't stop at your border. Pull up the map of your precinct and look at the adjacent ones. Partner with neighboring chairs to co-host street block walks, pool volunteer resources, and transform individual precinct success into a massive, unstoppable regional voting bloc.

## 3. Voter Registration & Education: The Road to 500K
* **The Road to 500,000 Voters:** Hidalgo County currently has roughly 430,000 registered voters, but we have a fast-growing population. Our goal as a county party is to hit 500,000 registered voters. This is the critical mass needed to permanently secure the Valley as a Democratic firewall in Texas.
* **Deputize and Mobilize:** If you aren't a Volunteer Deputy Registrar (VDR), become one. Every single Precinct Chair should be registering at least 5 new voters a month.
* **Target the youth:** High schools and community colleges are goldmines for new voters. Many young people want to vote but don't know the deadlines or processes.

## 4. The GOTV Push & The Proof of Power
* **Early Voting is everything:** Do not wait until Election Day. Push every supporter you identify to vote during the Early Voting period (starting October 19th).
* **The Proof is in the Numbers:** This organizing model is a proven math formula. In low-turnout runoffs, a well-organized core team of just 70+ volunteers can command 45% of the primary turnout in a precinct, effectively locking out the opposition. 
* **The November Ceiling:** Organizing your core base now during the quiet periods builds the engine that will rally hundreds of "surge" voters in November. 

## 5. How to Organize Without Burnout (The Multi-Tiered Network)
* **The Trap of the "Lone Ranger":** Many new precinct chairs make the mistake of trying to knock on every door themselves. This leads to rapid burnout. Don't do it alone.
* **The Precinct 107 Leadership Model:** Distribute the workload using a multi-tiered approach:
    1. **Precinct Chair:** Act as the central manager and strategist.
    2. **Neighborhood Captains (3–5 per precinct):** Divide your precinct into subdivisions and recruit leaders for those sectors.
    3. **Block Workers (3–5 per subdivision):** Captains assign workers to just 1 or 2 streets.
* **The "Power of 20" Data Model:** Empower every Neighborhood Captain to collect Name, Phone, Email, and Address for exactly 20 voters. This simple task systematically locks in 2% of your precinct's registered voters into our Texas Voter Activation Network (VAN).

## 6. Selling the Whole Ticket (Top to Bottom)
* **The Top of the Ticket drives the narrative:** While statewide and national races define the major battle lines, it's our job to bring those massive issues down to the neighborhood level. 
* **Down-ballot races impact daily life:** Make sure your voters know about the crucial down-ballot races—like the State Board of Education, judicial races, and county commissioners.
* **No candidate left behind:** Emphasize the importance of voting the *entire* ballot. "Bullet voting" hurts our local candidates. A rising tide lifts all boats.
* **Seek Out and Connect with Campaigns:** Don't wait for campaigns to come to you. Actively seek out campaigns that need boots on the ground—whether it's James Talarico, Congressman Henry Cuellar, Gina Hinojosa, Bobby Pulido, or organizations like Texas Together. Get connected with their field directors so you can bring their resources, materials, and energy directly into your precinct.

## 7. Immediate Next Steps (The Call to Action)
* **Request Your VAN Access:** To find the likely Democrats on your block, you need access immediately. Email the party or fill out the TDP VAN Request Page.
* **Sign Up for Precinct Chair 101:** Get trained. Book your shift on Mobilize right now.
* **Explore the Onboarding Hub:** Bookmark the HCDP Chair Onboarding Page to review your playbook, checklists, and survey forms.

***

**The Bottom Line:**
Thank you for stepping up. We don't win by hoping people show up; we win by doing the hard, granular work of organizing our own backyards. Make the best of it, have fun out there, and let's get to work turning Hidalgo County solid blue!
`;

# Hostile Audience Strategy & Q&A Prep

When presenting to a group that is anti-county chair, deeply concerned with transparency, and highly critical of the party's current output, your goal is to **pivot their frustration into localized action.** You cannot fix the county-wide legal battles today, but you *can* empower them to control their own precincts.

## Part 1: How to Subtly Address the Elephant in the Room
You want to validate their feelings of frustration and their desire for "truth and transparency" *without* taking sides in the legal battle or validating the infighting.

**Suggested Framing / Speaking Points:**
* **Acknowledge the Urgency:** *"We are the party's frontline. With November approaching fast, we cannot afford to wait for marching orders to start doing our jobs. The voters in your precincts are looking to us to protect their public schools, their jobs, and their rights."*
* **The Cavalry Isn't Coming:** *"The truth is, the timeline is short and the work ahead of us is massive. If we wait, we lose November. The cavalry isn't coming—we are the cavalry."*
* **Decentralize the Power:** *"The true power of the Democratic Party doesn’t live in an office title. It lives in this room. You don't need anyone's permission to organize your neighborhood. You are the local expert."*

---

## Part 2: Anticipated Hostile Questions & How to Pivot
When they throw complaints at you, validate the premise, but pivot the solution back to *them* and the precinct-level organizing model.

### Q1: "The county party isn't doing anything right now to help us."
**The Pivot (Empowerment):** 
"You're right that things are fractured at the top right now, and it's incredibly frustrating. But that is exactly why I am standing in front of you today. We cannot let administrative paralysis cost us the November election. The Precinct Chair model is brilliant because it's decentralized. You don't need the county party's permission to host a block walk, recruit 3 block captains, or throw a 'Burgers in the Park' event. We have to take ownership of our own backyards."

### Q2: "Our VAN (Voter Activation Network) numbers suck. The data is terrible."
**The Pivot (Actionable Solution):**
"I agree with you. The data we have right now is not where it needs to be. But the only way the VAN numbers get better is if we clean them ourselves, block by block. That is exactly why we are pushing the 'Power of 20' model. If every chair here just gets solid, verified data for 20 neighbors and we plug that into VAN, we fix the data problem from the ground up. We have to build the database we want."

### Q3: "Are we ever going to get together as a full County Executive Committee?"
**The Pivot (Focus on What We Can Control):**
"I want us all in one room as much as you do. Transparency demands that we meet. But while those legal and administrative hurdles are being fought out, the clock is ticking toward early voting. We cannot afford to pause. That is why we are heavily relying on 'Regional Coalitions.' If the whole county can't meet right now, then you need to partner with your 4 or 5 adjacent precinct chairs and build your own regional team to cover each other's blind spots."

### Q4: "How can you be up here representing a County Chair who is being sued/investigated?"
**The Pivot (Redefining Your Role):**
"I'm not here today to represent the courtroom or the legal battles. I am here representing the November ballot. My only allegiance right now is to making sure James Talarico, our SBOE candidates, and our local judges don't lose because we were too busy fighting each other to knock on doors. My goal is to make sure *you* have the tools to win your precinct, regardless of what happens at headquarters."

### Q5: "Where is the money/resources? The campaigns aren't helping us either."
**The Pivot (Proactive Seeking):**
"That is exactly why one of our key strategies today is 'Seek Out and Connect.' Do not wait for the party or the campaigns to bring the flyers to your porch. We have to be aggressive. Reach out directly to the field directors for Cuellar, Talarico, or Texas Together. Tell them 'I have a team of 5 block captains, give me literature.' When you show them you have an organized precinct, they will give you the resources."
`;

  menuOptionsRichard: menuOptionsRichardSpeech,
  menuOptions: menuOptionsSpeech,
  main: mainSpeech,
  qa: qaPrep
};

function loadDoc() {
  const selection = document.getElementById('docSelect').value;
  const content = docMap[selection] || menuOptionsRichardSpeech;
  
  const htmlContent = marked.parse(content);
  document.getElementById('left-content').innerHTML = htmlContent;
  document.getElementById('right-content').innerHTML = htmlContent;
}

// Initial load
loadDoc();

// Font sizing logic
let currentFontSize = 3.2; // rem
function changeFontSize(amount) {
  currentFontSize = Math.round((currentFontSize + amount) * 100) / 100;
  if (currentFontSize < 1.2) currentFontSize = 1.2;
  if (currentFontSize > 6.0) currentFontSize = 6.0;
  document.getElementById('right-panel').style.fontSize = currentFontSize + 'rem';
  document.getElementById('fontSizeDisplay').textContent = currentFontSize + 'rem';
}

// Auto-Scroll Logic
let isScrolling = false;
let scrollInterval = null;
let scrollSpeed = 2; // px per tick

function toggleAutoScroll() {
  isScrolling = !isScrolling;
  const btn = document.getElementById('scrollBtn');
  if (isScrolling) {
    btn.classList.add('active');
    btn.textContent = '⏸ Pause';
    startScrolling();
  } else {
    btn.classList.remove('active');
    btn.textContent = '▶ Scroll';
    stopScrolling();
  }
}

function startScrolling() {
  stopScrolling();
  scrollInterval = setInterval(() => {
    const rightPanel = document.getElementById('right-panel');
    rightPanel.scrollTop += scrollSpeed;
  }, 40);
}

function stopScrolling() {
  if (scrollInterval) {
    clearInterval(scrollInterval);
    scrollInterval = null;
  }
}

function adjustScrollSpeed(delta) {
  scrollSpeed += delta;
  if (scrollSpeed < 1) scrollSpeed = 1;
  if (scrollSpeed > 10) scrollSpeed = 10;
  document.getElementById('speedDisplay').textContent = 'Speed: ' + scrollSpeed;
}

function resetScroll() {
  document.getElementById('right-panel').scrollTo({ top: 0, behavior: 'smooth' });
  document.getElementById('left-panel').scrollTo({ top: 0, behavior: 'smooth' });
}

// Keyboard shortcuts (Space to toggle scroll, Up/Down for speed)
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    toggleAutoScroll();
  } else if (e.key === '=' || e.key === '+') {
    changeFontSize(0.25);
  } else if (e.key === '-' || e.key === '_') {
    changeFontSize(-0.25);
  }
});

// Resizer logic
const resizer = document.getElementById('resizer');
const leftPanel = document.getElementById('left-panel');
let isResizing = false;

resizer.addEventListener('mousedown', function(e) {
  isResizing = true;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', function(e) {
  if (!isResizing) return;
  let newWidth = (e.clientX / window.innerWidth) * 100;
  if (newWidth < 10) newWidth = 10;
  if (newWidth > 90) newWidth = 90;
  leftPanel.style.width = newWidth + '%';
});

document.addEventListener('mouseup', function(e) {
  if (isResizing) {
    isResizing = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});
</script>
