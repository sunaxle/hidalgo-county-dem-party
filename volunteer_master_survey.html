<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/webp" href="images/facebook_1656248751972_6946810765393131439.webp">

  <meta name="description" content="Official Website of the Hidalgo County Democratic Party. Empowering South Texas residents to build communities that represent them. Vote, Volunteer, and Get Involved.">
  <meta charset="UTF-8">

  <title>Volunteer Shift Survey - Hidalgo Dems</title>
  <style>
    /* Ultra-minimalist, mobile-first, black and white design */
    :root {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --gray: #666666;
      --light-gray: #f5f5f5;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 3px solid var(--text);
      padding-bottom: 1rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--gray);
      margin-top: 0.5rem;
    }

    .form-section {
      margin-bottom: 2.5rem;
    }

    .form-section h2 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 1rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--text);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-weight: 700;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .form-label-sub {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 0.5rem;
      font-weight: 400;
    }

    /* Inputs */
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 1rem;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 500;
      appearance: none; /* remove native styling */
      border-radius: 8px;
    }

    .form-select {
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23000000%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem top 50%;
      background-size: 0.65rem auto;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      
      box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
    }

    /* Stacked Checkboxes / Radios for Mobile */
    .check-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      padding: 1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: var(--bg);
      transition: background 0.2s;
    }

    .check-item:active {
      background: var(--light-gray);
    }

    .check-item input[type="radio"],
    .check-item input[type="checkbox"] {
      margin-top: 0.25rem;
      margin-right: 1rem;
      width: 1.25rem;
      height: 1.25rem;
      accent-color: var(--text);
    }

    .check-item div {
      flex: 1;
    }

    .label-text {
      font-weight: 700;
      display: block;
      font-size: 1rem;
    }

    .label-desc {
      font-size: 0.85rem;
      color: var(--gray);
      margin-top: 0.25rem;
      display: block;
    }

    /* Button */
    .btn-submit {
      width: 100%;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 1.25rem;
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-submit:active {
      transform: translateY(2px);
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-submit.loading .spinner {
      display: inline-block;
    }

    /* Success State */
    .success-message {
      display: none;
      border: 3px solid var(--border);
      padding: 2rem;
      text-align: center;
      border-radius: 8px;
      background: var(--light-gray);
    }

    .success-message h3 {
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
  </style>

  <!-- Open Graph Tags -->
  <meta property="og:title" content="Volunteer Shift Survey - Hidalgo Dems">
  <meta property="og:description" content="Official Website of the Hidalgo County Democratic Party. Empowering South Texas residents to build communities that represent them. Vote, Volunteer, and Get Involved.">

<body>

  <div class="app-container">
    <div id="success-banner" class="success-message">
      <h3>Response Recorded!</h3>
      <p>Your data has been securely synced with the VAN and our volunteer coordinator sheet.</p>
      <button class="btn-submit" style="margin-top: 2rem;" onclick="window.location.reload();">Submit Another</button>
    </div>

    <form id="master-survey-form">
      <div class="header">
        <h1>Volunteer Intake</h1>
        <p>Hidalgo County Democratic Party</p>
      </div>

      <!-- SECTION 1: Submitter Context -->
      <div class="form-section">
        <h2>1. Submitter</h2>
        <div class="form-group">
          <label class="form-label">Who are you submitting for?</label>
          <div class="check-group">
            <label class="check-item">
              <input type="radio" name="submitter_type" value="Self" required>
              <div>
                <span class="label-text">Myself</span>
                <span class="label-desc">I am filling out my own profile.</span>
              </div>
            </label>
            <label class="check-item">
              <input type="radio" name="submitter_type" value="Proxy">
              <div>
                <span class="label-text">Someone Else (Proxy)</span>
                <span class="label-desc">I'm a Precinct Chair submitting for a voter.</span>
              </div>
            </label>
          </div>
        </div>
      </div>

      <!-- SECTION 2: Contact Info -->
      <div class="form-section">
        <h2>2. Contact</h2>
        <div class="form-group">
          <label class="form-label">First Name *</label>
          <input type="text" class="form-input" name="first_name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name *</label>
          <input type="text" class="form-input" name="last_name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" name="email">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" class="form-input" name="phone" required>
        </div>
        <div class="form-group">
          <label class="form-label">Precinct Number</label>
          <input type="number" class="form-input" name="precinct" placeholder="e.g. 107">
        </div>
        <div class="form-group">
          <label class="form-label">Preferred Contact Method</label>
          <div class="check-group">
            <label class="check-item"><input type="radio" name="preferred_contact" value="Text/SMS" checked><span class="label-text">Text / SMS</span></label>
            <label class="check-item"><input type="radio" name="preferred_contact" value="Phone Call"><span class="label-text">Phone Call</span></label>
            <label class="check-item"><input type="radio" name="preferred_contact" value="Email"><span class="label-text">Email</span></label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Best time to contact?</label>
          <select class="form-select" name="best_time">
            <option value="Anytime">Anytime</option>
            <option value="Morning">Morning (8am - 12pm)</option>
            <option value="Afternoon">Afternoon (12pm - 5pm)</option>
            <option value="Evening">Evening (5pm - 8pm)</option>
            <option value="Weekends">Weekends Only</option>
          </select>
        </div>
      </div>

      <!-- SECTION 3: Demographics & VAN -->
      <div class="form-section">
        <h2>3. Demographics</h2>
        <div class="form-group">
          <label class="form-label">Race / Ethnicity</label>
          <select class="form-select" name="ethnicity">
            <option value="">Prefer not to answer</option>
            <option value="Hispanic/Latino">Hispanic or Latino</option>
            <option value="White">White / Caucasian</option>
            <option value="Black/African American">Black / African American</option>
            <option value="Asian">Asian / Pacific Islander</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Top Priority Issues</label>
          <span class="form-label-sub">Select up to 3 issues you care about most.</span>
          <div class="check-group">
            <label class="check-item"><input type="checkbox" name="issues[]" value="Economy"><span class="label-text">Economy / Jobs</span></label>
            <label class="check-item"><input type="checkbox" name="issues[]" value="Immigration"><span class="label-text">Immigration</span></label>
            <label class="check-item"><input type="checkbox" name="issues[]" value="Education"><span class="label-text">Public Education</span></label>
            <label class="check-item"><input type="checkbox" name="issues[]" value="Healthcare"><span class="label-text">Healthcare</span></label>
            <label class="check-item"><input type="checkbox" name="issues[]" value="Reproductive Rights"><span class="label-text">Reproductive Rights</span></label>
            <label class="check-item"><input type="checkbox" name="issues[]" value="Voting Rights"><span class="label-text">Voting Rights</span></label>
            <label class="check-item"><input type="checkbox" name="issues[]" value="Border Security"><span class="label-text">Border Security</span></label>
          </div>
        </div>
      </div>

      <!-- SECTION 4: Campaigns -->
      <div class="form-section">
        <h2>4. Campaigns</h2>
        <div class="form-group">
          <label class="form-label">Are you a Teacher/Educator?</label>
          <div class="check-group">
            <label class="check-item"><input type="radio" name="is_teacher" value="Yes"><span class="label-text">Yes, I am an educator</span></label>
            <label class="check-item"><input type="radio" name="is_teacher" value="No" checked><span class="label-text">No</span></label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Specific Campaigns to Help</label>
          <div class="check-group">
            <label class="check-item"><input type="checkbox" name="target_campaigns[]" value="Straight Ticket Democrats"><span class="label-text">Straight Ticket Democrats</span></label>
            <label class="check-item"><input type="checkbox" name="target_campaigns[]" value="Thomas Rey Garcia"><span class="label-text">Thomas Rey Garcia</span></label>
            <label class="check-item"><input type="checkbox" name="target_campaigns[]" value="Bobby Pulido"><span class="label-text">Bobby Pulido</span></label>
            <label class="check-item"><input type="checkbox" name="target_campaigns[]" value="James Talarico"><span class="label-text">James Talarico</span></label>
            <label class="check-item"><input type="checkbox" name="target_campaigns[]" value="Gina Hinojosa"><span class="label-text">Gina Hinojosa</span></label>
            <label class="check-item"><input type="checkbox" name="target_campaigns[]" value="Henry Cuellar"><span class="label-text">Henry Cuellar</span></label>
          </div>
          <input type="text" class="form-input" name="other_campaigns" placeholder="Other campaigns? (Type name)" style="margin-top: 1rem;">
        </div>
      </div>

      <!-- SECTION 5: Volunteer Action Plan -->
      <div class="form-section">
        <h2>5. Action Plan</h2>
        <div class="form-group">
          <label class="form-label">How do you want to help?</label>
          <div class="check-group">
            <label class="check-item"><input type="checkbox" name="volunteer_actions[]" value="Block Walking"><div><span class="label-text">Block Walking</span></div></label>
            <label class="check-item"><input type="checkbox" name="volunteer_actions[]" value="Phone Banking"><div><span class="label-text">Phone Banking</span></div></label>
            <label class="check-item"><input type="checkbox" name="volunteer_actions[]" value="Touch 10"><div><span class="label-text">Touch 10 (Turn out 10 friends)</span></div></label>
            <label class="check-item"><input type="checkbox" name="volunteer_actions[]" value="Host Event"><div><span class="label-text">Host a Meet & Greet</span></div></label>
            <label class="check-item"><input type="checkbox" name="volunteer_actions[]" value="Data/VAN"><div><span class="label-text">Data Entry / VAN</span></div></label>
            <label class="check-item"><input type="checkbox" name="volunteer_actions[]" value="Election Worker"><div><span class="label-text">Election Worker</span></div></label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Shift Availability</label>
          <div class="check-group">
            <label class="check-item"><input type="checkbox" name="shifts[]" value="Weekday Mornings"><span class="label-text">Weekday Mornings</span></label>
            <label class="check-item"><input type="checkbox" name="shifts[]" value="Weekday Afternoons"><span class="label-text">Weekday Afternoons</span></label>
            <label class="check-item"><input type="checkbox" name="shifts[]" value="Weekday Evenings"><span class="label-text">Weekday Evenings</span></label>
            <label class="check-item"><input type="checkbox" name="shifts[]" value="Saturday Morning"><span class="label-text">Saturday Morning</span></label>
            <label class="check-item"><input type="checkbox" name="shifts[]" value="Saturday Afternoon"><span class="label-text">Saturday Afternoon</span></label>
            <label class="check-item"><input type="checkbox" name="shifts[]" value="Sunday Afternoon"><span class="label-text">Sunday Afternoon</span></label>
          </div>
        </div>
      </div>

      <!-- SECTION 6: Open Mic -->
      <div class="form-section">
        <h2>6. Comments</h2>
        <div class="form-group">
          <label class="form-label">Suggestions or intelligence from your precinct?</label>
          <textarea class="form-textarea" name="open_feedback" rows="5" placeholder="Type here..."></textarea>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span class="spinner"></span>
        <span class="btn-text">Submit Profile</span>
      </button>

    </form>
  </div>

  <script src="js/survey_handler.js"></script>
</body>
</html>
