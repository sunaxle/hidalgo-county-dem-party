<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Precinct Target Map | HCDP Internal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/state_party_clone.css" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh;}
    .map-container { flex-grow: 1; display: flex; }
    #map { flex-grow: 1; height: 100%; z-index: 1;}
    .sidebar { width: 350px; background: white; padding: 2rem; box-shadow: 2px 0 10px rgba(0,0,0,0.1); overflow-y: auto; z-index: 2;}
    
    h2 { font-family: 'Montserrat', sans-serif; color: #0a3161; margin-top: 0;}
    .legend-item { display: flex; align-items: center; margin-bottom: 1rem; }
    .legend-color { width: 24px; height: 24px; border-radius: 4px; margin-right: 1rem; }
    
    .btn { display: block; width: 100%; background: #0a3161; color: white; padding: 1rem; text-align: center; border-radius: 6px; text-decoration: none; font-weight: 600; margin-top: 2rem; transition: 0.2s; border: none; cursor: pointer;}
    .btn:hover { background: #001a40; }

    .stat-card { background: #f1f5f9; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; border-left: 4px solid #0a3161;}
    .stat-val { font-size: 1.5rem; font-weight: 800; color: #0a3161; font-family: 'Montserrat', sans-serif;}
    .stat-label { font-size: 0.85rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;}
  </style>
</head>
<body>

  <nav class="tx-clone-nav">
    <div class="tx-clone-nav-center">
      <a href="precinct_toolkit.html" class="nav-item" style="color: white; font-weight: 800; text-decoration: none;">← BACK TO TOOLKIT</a>
    </div>
  </nav>

  <div class="map-container">
    <div class="sidebar">
      <h2>📍 Precinct Targeting</h2>
      <p style="color: #64748b;">AI-generated priority walking zones based on historical Democratic turnout and early voting proximity.</p>
      
      <div class="form-group" style="margin-bottom: 2rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Select Precinct</label>
        <select style="width: 100%; padding: 0.5rem;" onchange="updateStats()">
          <option value="107">Precinct 107 (McAllen)</option>
          <option value="41">Precinct 41 (Edinburg)</option>
          <option value="12">Precinct 12 (Mission)</option>
        </select>
      </div>

      <div class="stat-card">
        <div class="stat-val">Priority 1</div>
        <div class="stat-label">Optimal Walking Zone</div>
      </div>
      
      <h3 style="font-family: 'Montserrat', sans-serif; font-size: 1.1rem; margin-top: 2rem;">Legend</h3>
      <div class="legend-item">
        <div class="legend-color" style="background: rgba(239, 68, 68, 0.5); border: 2px solid #ef4444;"></div>
        <div><strong>High Priority</strong><br><span style="font-size: 0.85rem; color: #64748b;">Low propensity Dems</span></div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: rgba(59, 130, 246, 0.5); border: 2px solid #3b82f6;"></div>
        <div><strong>Medium Priority</strong><br><span style="font-size: 0.85rem; color: #64748b;">Mixed turnout</span></div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: rgba(34, 197, 94, 0.5); border: 2px solid #22c55e;"></div>
        <div><strong>Low Priority</strong><br><span style="font-size: 0.85rem; color: #64748b;">High propensity Dems (Base)</span></div>
      </div>

      <button class="btn" onclick="alert('Exporting optimal route to PDF...')">Export Route Map (PDF)</button>
    </div>
    
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // Initialize map centered on McAllen, TX
    const map = L.map('map').setView([26.2034, -98.2300], 14);

    // Add CartoDB Positron base map (clean, grayscale, perfect for overlays)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // Mock Target Zones (Polygons)
    
    // High Priority Zone
    L.polygon([
      [26.205, -98.235],
      [26.210, -98.235],
      [26.210, -98.225],
      [26.205, -98.225]
    ], {
      color: '#ef4444',
      fillColor: '#ef4444',
      fillOpacity: 0.5
    }).addTo(map).bindPopup("<b>Zone A</b><br>High Priority: 45 doors");

    // Medium Priority Zone
    L.polygon([
      [26.195, -98.240],
      [26.200, -98.240],
      [26.200, -98.230],
      [26.195, -98.230]
    ], {
      color: '#3b82f6',
      fillColor: '#3b82f6',
      fillOpacity: 0.5
    }).addTo(map).bindPopup("<b>Zone B</b><br>Medium Priority: 80 doors");

    // Low Priority Zone (Base)
    L.polygon([
      [26.210, -98.220],
      [26.215, -98.220],
      [26.215, -98.210],
      [26.210, -98.210]
    ], {
      color: '#22c55e',
      fillColor: '#22c55e',
      fillOpacity: 0.5
    }).addTo(map).bindPopup("<b>Zone C</b><br>Low Priority (Base): 120 doors");

    // Early Voting Location Marker
    const evIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    L.marker([26.206, -98.230], {icon: evIcon}).addTo(map)
      .bindPopup("<b>Fireman's Park</b><br>Early Voting Location");

    function updateStats() {
      // Mock interactivity
      map.setView([26.3017, -98.1633], 14); // Jump to Edinburg approx
    }
  </script>
</body>
</html>
