<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Dashboard | JLVC App</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .bar-row { display: flex; align-items: center; margin-bottom: 1rem; }
    .bar-label { width: 60px; font-size: 0.8rem; color: #cbd5e1; }
    .bar-track { flex-grow: 1; height: 16px; background: rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; margin: 0 10px; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--color-secondary), var(--color-primary)); border-radius: 8px; }
    .bar-value { width: 50px; font-size: 0.8rem; text-align: right; font-weight: bold; }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-container">
    <header class="top-bar">
      <a href="index.html" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Registration Data
      </a>
    </header>

    <section style="padding: 2rem 1.5rem;">
      <h2 class="text-gradient" style="font-size: 1.8rem; margin-bottom: 1.5rem;">Registration Growth</h2>
      
      <div class="glass-panel" style="margin-bottom: 2rem; padding: 1.5rem;">
        <h3 style="font-size: 1.1rem; margin-bottom: 1rem;">Hidalgo County (Year over Year)</h3>
        
        <div class="bar-row"><div class="bar-label">2020</div><div class="bar-track"><div class="bar-fill" style="width: 60%;"></div></div><div class="bar-value">380K</div></div>
        <div class="bar-row"><div class="bar-label">2022</div><div class="bar-track"><div class="bar-fill" style="width: 70%;"></div></div><div class="bar-value">405K</div></div>
        <div class="bar-row"><div class="bar-label">2024</div><div class="bar-track"><div class="bar-fill" style="width: 85%;"></div></div><div class="bar-value">432K</div></div>
        <div class="bar-row"><div class="bar-label" style="color: var(--color-primary); font-weight: bold;">2026</div><div class="bar-track"><div class="bar-fill" style="width: 95%; background: var(--color-primary);"></div></div><div class="bar-value" style="color: var(--color-primary);">Target</div></div>
      </div>

      <h2 class="text-gradient" style="font-size: 1.8rem; margin-bottom: 1.5rem;">By Area (Top Cities)</h2>
      
      <div class="glass-panel" style="margin-bottom: 2rem; padding: 1.5rem;">
        <div class="bar-row"><div class="bar-label">McAllen</div><div class="bar-track"><div class="bar-fill" style="width: 90%; background: var(--color-secondary);"></div></div><div class="bar-value">92K</div></div>
        <div class="bar-row"><div class="bar-label">Edinburg</div><div class="bar-track"><div class="bar-fill" style="width: 75%; background: var(--color-secondary);"></div></div><div class="bar-value">75K</div></div>
        <div class="bar-row"><div class="bar-label">Mission</div><div class="bar-track"><div class="bar-fill" style="width: 65%; background: var(--color-secondary);"></div></div><div class="bar-value">61K</div></div>
        <div class="bar-row"><div class="bar-label">Pharr</div><div class="bar-track"><div class="bar-fill" style="width: 50%; background: var(--color-secondary);"></div></div><div class="bar-value">48K</div></div>
        <div class="bar-row"><div class="bar-label">Weslaco</div><div class="bar-track"><div class="bar-fill" style="width: 40%; background: var(--color-secondary);"></div></div><div class="bar-value">31K</div></div>
      </div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Home</span>
      </a>
      <a href="civics.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        <span>Civics</span>
      </a>
      <a href="map.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        <span>Map</span>
      </a>
      <a href="dashboard.html" class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span>Data</span>
      </a>
      <a href="hotspots.html" class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>Spots</span>
      </a>
    </nav>
  </div>
</body>
</html>
